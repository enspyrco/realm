name: realm_workspace
description: >-
  Workspace root for the Realm engine and its first-party plugins. Nothing
  depends on this package: it holds the shared resolution, the lockfile and
  the lint set. See README.md.
publish_to: none

environment:
  sdk: ^3.6.0
  # THE Flutter pin for this repo: CI reads it (flutter-version-file), Renovate
  # bumps it and regenerates pubspec.lock on the new version in the same PR.
  # Exact on purpose: the lockfile only reproduces on the Flutter that wrote it,
  # so `flutter pub get` refuses any other. Upgrade your local Flutter to match.
  #
  # Renovate regenerates the lock with `flutter pub` only if this file's text
  # contains the string `sdk: flutter` (renovatebot/renovate,
  # lib/modules/manager/pub/artifacts.ts). This root has no Flutter dependency
  # to supply it, so without this paragraph Renovate runs `dart pub`, which
  # refuses this workspace, and the bump PR ships a stale lock (enspyrco/realm#5).
  # CI fails if the string goes missing. If Renovate learns to read
  # environment.flutter, drop this paragraph and that CI step.
  flutter: 3.47.6

# CI runs every member's tests by iterating THIS list (via `dart pub workspace
# list`), not a directory glob, and fails if a declared member has no test/
# directory. Adding a member here enrols it in CI; see .github/workflows/ci.yml.
workspace:
  - packages/realm_core
  - packages/realm_firebase
  - examples/livekit-token-server

dev_dependencies:
  # Provides the lint set in analysis_options.yaml. Same version the members
  # resolved inside tech_world before the split.
  flutter_lints: ^6.0.0
