name: realm_core
description: >-
  The core of Realm, a multiplayer worldbuilding engine: the protocols and
  vocabulary types for rooms that each instantiate a World (identity,
  presence, voice, room transport, blob storage). Interfaces only, no runtime
  dependencies. See DESIGN.md for the architectural pin and package shape.
publish_to: none
version: 0.0.1
# No LICENSE file yet: none ships until the terms are settled (decided
# 2026-10-27). The legal read now examines MPL-2.0 for the client packages
# (this one, realm_firebase) with AGPL-3.0 for server pieces, in place of the
# earlier AGPL-v3-plus-linking-exception plan (task #1059); then a contributor
# agreement, then the NOTICE/header sweep. See DESIGN.md, "License".

environment:
  sdk: ^3.6.0

resolution: workspace

dev_dependencies:
  test: ^1.25.0
